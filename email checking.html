
<html>
<head>
    <title>Form Validation</title>
</head>

<body>

    <form id="userform" onsubmit="return validateForm()">

        <label>Name:
            <input type="text" id="name1">
        </label>
        <br><br>

        <label>Email id:
            <input type="email" id="name2">
        </label>
        <br><br>

        <label>Phone no:
            <input type="tel" id="mobile1">
        </label>
        <br><br>

        <button type="submit">Submit</button>

    </form>

<script>

function validateName(name) {

    if(name == "") {
        alert("Name can't be blank");
        return false;
    }

    if(name.length < 3) {
        alert("Name must be at least three characters");
        return false;
    }
    return true;
}
function validateForm() {
    var name = document.getElementById("name1").value.trim();
    var mobile = document.getElementById("mobile1").value.trim();
    var email = document.getElementById("name2").value.trim();
    if(!validateName(name)) {
        return false;
    }
    if(mobile == "") {
        alert("Mobile number can't be blank");
        return false;
    }

    if(mobile.length != 10) {
        alert("Mobile number must be exactly 10 digits long");
        return false;
    }

    for(var i = 0; i < mobile.length; i++) {

        if(mobile[i] < '0' || mobile[i] > '9') {
            alert("Mobile number must contain digits only");
            return false;
        }
    }

    if(email == "") {
        alert("Email can't be blank");
        return false;
    }
    function validateEmail(email){
        var reg=new egExp("^[a-zA-Z0-9_.]+@[a-zA-Z0-9.]+$");
        if(!reg.test(email)){
            alert("Invalid email id");
            return false;
        }
        return true;
    }

    alert("Form submitted successfully!");
    return true;

}
</script>
</body>
</html>
