<html>
<head>
    <title> Sum of the array</title>
</head>
<body>
    <h2> Sum of the array</h2>
    <p id="sum of array"></p>
    <script>
        var x=10;
        var y=20;
        var z=x+y;
        document.getElementById("sum of array").textContent=+z;
        </script>
</body>
</html>
